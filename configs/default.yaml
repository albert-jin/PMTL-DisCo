experiment:
  dataset: politifact
  few_shot: 16
  few_shot_list: [16, 32, 128]
  supported_few_shot: [16, 32, 64, 128]
  iterations: 20

data:
  data_dir: data
  user_threshold: 5
  prefer_preprocessed_graph: true

model:
  plm_name: bert-base-uncased
  prompt_template: "It is a [MASK] news: {text}"
  real_label_words:
    - news
    - real
    - true
    - factual
    - authentic
    - genuine
    - verified
    - credible
    - accurate
    - legit
  fake_label_words:
    - rumor
    - fake
    - false
    - hoax
    - misleading
    - fabricated
    - bogus
    - deceptive
    - untrue
    - phony
  verbalizer_hidden_dim: 128
  verbalizer_dropout: 0.1

train:
  seed: 0
  epochs: 3
  batch_size: 8
  max_length: 128
  lr: 5.0e-5
  alpha1: 1.0
  alpha2: 0.01
  gamma: 0.1

inference:
  k_threshold: 0.35
  mu: 0.65
  use_reasoning: true

output:
  root_dir: outputs/pmtl_disco

